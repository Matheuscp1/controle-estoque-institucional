services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estoque_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/estoque
      DB_USER: estoque
      DB_PASSWORD: ${DB_PASSWORD:-estoque_local}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
