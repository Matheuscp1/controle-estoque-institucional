services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: estoque
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-estoque_local}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estoque_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/estoque?reWriteBatchedInserts=true
      DB_USER: estoque
      DB_PASSWORD: ${DB_PASSWORD:-estoque_local}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: estoque
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-estoque_local}
      IMPORTS_ENABLED: "true"
      IMPORTS_DIRECTORY: /data/imports
    volumes:
      - import_files:/data/imports
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  postgres_data:
  rabbit_data:
  import_files:
