spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    connect-timeout: 200ms
    timeout: 200ms
    repositories:
      enabled: false
  servlet:
    multipart:
      max-file-size: 128MB
      max-request-size: 129MB
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    username: ${RABBIT_USER:estoque}
    password: ${RABBIT_PASSWORD:estoque_local}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 2
        default-requeue-rejected: false
  application:
    name: controle-estoque-institucional
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque?reWriteBatchedInserts=true}
    username: ${DB_USER:estoque}
    password: ${DB_PASSWORD:estoque_local}
    hikari:
      maximum-pool-size: 10
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
imports:
  enabled: ${IMPORTS_ENABLED:true}
  directory: ${IMPORTS_DIRECTORY:./import-data}
  consumers: ${IMPORT_CONSUMERS:2}
app:
  read-cache:
    enabled: ${READ_CACHE_ENABLED:true}
    ttl-ms: ${READ_CACHE_TTL_MS:2000}
    max-response-bytes: 262144
